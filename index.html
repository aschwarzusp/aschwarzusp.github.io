<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Deslocamento por RA</title>
<link rel="stylesheet" href="a4.css">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.166.1/build/three.module.js"
  }
}
</script>
</head>
<body>

<!-- ============ setup (outside the AR overlay) ============ -->
<div id="setup">
  <h2>A4 — Mobile AR Docking</h2>
  <p>Digite seu código/pseudônimo:<br><input id="pid" value="P1"></p>
  <p>Pick your destiny:<br>
     <select id="firstTech">
       <option value="touch">1 — Gestos na tela</option>
       <option value="carry">2 — Agarramento por botão</option>
     </select>
  </p>
  <button id="startBtn">Iniciar AR</button>
  <p style="font-size:12px;color:#aaa">
     Aponte o celular para uma mesa bem iluminada e aperte Iniciar.
  </p>
</div>

<!-- ============ dom-overlay root for the AR session ============ -->
<div id="overlay">
  <div id="hud">Aponte o celular para uma superfície plana horizontal</div>
  <div id="msg"></div>

  <div id="controls">
    <button id="btnCarry" style="display:none">Carregar (segure)</button>
    <button id="btnRotL"  style="display:none">↺</button>
    <button id="btnRotR"  style="display:none">↻</button>
    <button id="btnCSV"   style="display:none">Baixar CSV</button>
    <button id="btnEnd"   style="display:none">Sair</button>
  </div>

  <!-- post-technique fatigue question (1–5) -->
  <div id="fatigue" class="panel">
    <p id="fatigueQ">Qual o grau de cansaço em seus braços?</p>
    <div class="scale">
      <button data-val="1">1</button>
      <button data-val="2">2</button>
      <button data-val="3">3</button>
      <button data-val="4">4</button>
      <button data-val="5">5</button>
    </div>
    <p class="hint">1 = nada cansado · 5 = muito cansado</p>
  </div>

  <!-- shown after the AR session ends (data is NOT lost) -->
  <div id="post" class="panel">
    <p><strong>Fim</strong></p>
    <p id="postInfo"></p>
    <div class="scale">
      <button id="btnCSV2">Baixar CSV</button>
      <button id="btnReload">Usar de novo</button>
    </div>
  </div>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
